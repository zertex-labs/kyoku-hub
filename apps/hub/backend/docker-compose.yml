services:
  postgres:
    image: postgres:17-alpine
    container_name: kyoku-hub-postgres
    environment:
      POSTGRES_USER: kyoku
      POSTGRES_PASSWORD: kyoku
      POSTGRES_DB: kyoku_hub
    ports:
      - "5432:5432"
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
