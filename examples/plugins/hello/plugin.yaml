apiVersion: 1
name: hello
version: 1.0.0
author: kyoku
description: Minimal plugin - logs each tagged track and drops one file in the album

executable: ./hello
hooks: [track.tagged, album.beforePublish]
timeout: 20s

config:
  - key: greeting
    type: string
    label: Greeting
    default: hello
  - key: writeFile
    type: bool
    label: Write hello.txt into the album
    default: true
