syntax = "proto3";

package fs.v1;

option go_package = "github.com/zertex-labs/kyoku-hub/proto/gen/fs/v1";

// Envelope wraps all messages sent over the Hub <-> Fs WS connection.
// Each message has exactly one payload field set.
message Envelope {
  oneof payload {
    // Auth handshake (hub -> fs)
    Challenge challenge = 1;
    AuthResult auth_result = 2;

    // Auth handshake (fs -> hub)
    ChallengeResponse challenge_response = 3;

    // Sync (hub -> fs)
    SyncRequest sync_request = 4;

    // Sync (fs -> hub)
    ScanResult scan_result = 5;
  }
}

// Hub -> Fs: challenge with random nonce for keypair auth
message Challenge {
  bytes nonce = 1; // 32-byte random nonce
}

// Fs -> Hub: signed nonce proving identity
message ChallengeResponse {
  bytes signature = 1; // ed25519 signature of the nonce
}

// Hub -> Fs: result of the auth handshake
message AuthResult {
  bool success = 1;
  string error = 2;
}

// Hub -> Fs: trigger a library scan
message SyncRequest {
  bool full = 1; // if true, bypass cache and do a full rescan
}

// A single track's metadata from the fs scan
message TrackEntry {
  string rpath = 1;
  string title = 2;
  string album = 3;
  string artist = 4;
  int32 year = 5;
  int32 track_num = 6;
  string musicbrainz_release_group_id = 7;
  string musicbrainz_artist_id = 8;
  // The identifiers that make a file findable by everything else: without them a
  // library can only match on text. Sent so the hub can say "this album is
  // present but not identified" instead of only "present".
  string musicbrainz_release_id = 9;
  string musicbrainz_track_id = 10;
  string isrc = 11;
}

// Fs -> Hub: scan results
message ScanResult {
  repeated TrackEntry tracks = 1;
}
