version: "3"

tasks:
  # ── Dependencies (postgres containers) ───────────────────────────────────────

  deps:hub:
    desc: Start hub postgres
    dir: apps/hub/backend
    cmds:
      - docker compose up -d
    status:
      - docker ps --filter name=kyoku-hub-postgres --filter status=running -q | grep -q .

  deps:brainz:
    desc: Start brainz postgres
    dir: apps/brainz
    cmds:
      - docker compose up -d
    status:
      - docker ps --filter name=kyoku-brainz-postgres --filter status=running -q | grep -q .

  deps:
    desc: Start all dependency containers
    deps: [deps:hub, deps:brainz]

  deps:down:
    desc: Stop all dependency containers
    cmds:
      - docker compose -f apps/hub/backend/docker-compose.yml down
      - docker compose -f apps/brainz/docker-compose.yml down

  # ── Data resets (pgdata dirs are root-owned bind mounts, so rm runs in docker) ─

  deps:reset:hub:
    desc: Stop hub postgres and delete its data (orphans registered fs agents)
    cmds:
      - docker compose -f apps/hub/backend/docker-compose.yml down
      - docker run --rm -v "{{.ROOT_DIR}}/apps/hub/backend/data:/wipe" alpine rm -rf /wipe/pgdata

  deps:reset:brainz:
    desc: Stop brainz postgres and delete its data
    cmds:
      - docker compose -f apps/brainz/docker-compose.yml down
      - docker run --rm -v "{{.ROOT_DIR}}/apps/brainz/data:/wipe" alpine rm -rf /wipe/pgdata

  fs:reset:
    desc: Delete fs agent identity + scan cache (agent needs a new AGENT_TOKEN)
    cmds:
      - docker compose -f apps/fs/docker-compose.yml down
      - docker run --rm -v "{{.ROOT_DIR}}/apps/fs/data:/wipe" alpine sh -c 'rm -rf /wipe/* /wipe/.[!.]*'

  deps:reset:
    desc: Stop everything and wipe ALL local data (hub + brainz postgres, fs agent identity)
    prompt: This permanently deletes hub/brainz postgres data and the fs agent identity. Continue?
    cmds:
      - task: deps:reset:hub
      - task: deps:reset:brainz
      - task: fs:reset

  # ── Individual dev servers ────────────────────────────────────────────────────

  dev:hub:
    desc: Run hub backend (starts postgres first)
    deps: [deps:hub]
    dir: apps/hub/backend
    cmds:
      - go run ./cmd/server/main.go

  dev:brainz:
    desc: Run brainz (starts postgres first)
    deps: [deps:brainz]
    dir: apps/brainz
    cmds:
      - go run ./cmd/server/main.go

  dev:frontend:
    desc: Run frontend dev server
    dir: apps/hub/frontend
    cmds:
      - bun run dev

  dev:fs:
    desc: Run fs agent (requires AGENT_TOKEN on first boot)
    dir: apps/fs
    cmds:
      - go run ./cmd/server/main.go

  # ── Run everything ────────────────────────────────────────────────────────────

  dev:
    desc: Start all deps then run hub, brainz, and frontend concurrently
    deps: [deps]
    cmds:
      - bash -c 'cleanup() { kill 0; task deps:down; }; trap cleanup INT TERM EXIT; (cd apps/hub/backend && go run ./cmd/server/main.go) & (cd apps/brainz && go run ./cmd/server/main.go) & (cd apps/fs && go run ./cmd/server/main.go) & (cd apps/hub/frontend && bun run dev) & wait'

  # ── Proto generation ──────────────────────────────────────────────────────────

  proto:
    desc: Generate protobuf code (requires buf)
    dir: proto
    cmds:
      - buf generate
