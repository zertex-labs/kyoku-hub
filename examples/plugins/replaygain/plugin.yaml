apiVersion: 1
name: replaygain
version: 2.0.0
author: kyoku
description: ReplayGain 2.0 album and track gain via rsgain

executable: ./replaygain
hooks: [album.beforePublish]
timeout: 600s
# rsgain missing or failing must not cost the user their download.
required: false
extensions: [".flac", ".mp3", ".ogg", ".opus", ".m4a"]

permissions:
  exec: [/usr/bin/rsgain]

config:
  - key: multithread
    type: select
    label: Threads
    help: Files scanned in parallel.
    default: MAX
    options: [MAX, "1", "2", "4"]
  - key: skipExisting
    type: bool
    label: Skip files that already carry ReplayGain
    help: A resumed or retried download will not rescan what is already tagged.
    default: true
  - key: referenceLoudness
    type: select
    label: Reference loudness (LUFS)
    help: rsgain's target loudness; "default" leaves it to rsgain.
    default: default
    options: [default, "-23", "-18", "-16", "-14"]
